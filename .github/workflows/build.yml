name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run Vulnerability Checker
      run: |
        chmod +x ./shai-hulud-detector.sh
        echo "🔍 Running vulnerability scan with timeout..."
        if output=$(timeout 300 ./shai-hulud-detector.sh ./ 2>&1); then
          echo "Vulnerability scan completed successfully:"
          echo "$output"
          if echo "$output" | grep -q "HIGH RISK: Malicious workflow files detected"; then
            echo "❌ Security vulnerability detected! Aborting workflow."
            exit 1
          else
            echo "✅ No high-risk vulnerabilities detected."
          fi
        else
          exit_code=$?
          if [ $exit_code -eq 124 ]; then
            echo "⚠️ Vulnerability scan timed out after 5 minutes. Proceeding with caution."
            echo "Consider running the scan manually: ./shai-hulud-detector.sh ./"
          else
            echo "❌ Vulnerability scan failed with exit code $exit_code"
            exit $exit_code
          fi
        fi

    - name: Build application
      run: npm run build

    - name: Run tests
      run: npm test -- --coverage --passWithNoTests